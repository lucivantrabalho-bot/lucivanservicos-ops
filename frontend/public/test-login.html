<!DOCTYPE html>
<html>
<head>
    <title>Teste de Login Direto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form { max-width: 400px; margin: 0 auto; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        .result { margin: 20px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <div class="form">
        <h2>Teste de Login Direto - CN19</h2>
        <input type="text" id="username" placeholder="Usuário" value="admin">
        <input type="password" id="password" placeholder="Senha" value="admin123">
        <button onclick="testLogin()">Testar Login</button>
        <button onclick="testHealth()">Testar Conectividade</button>
        <div id="result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8001/api';
        
        function showResult(message, type = 'info') {
            document.getElementById('result').innerHTML = 
                `<div class="result ${type}">${message}</div>`;
        }
        
        async function testHealth() {
            showResult('Testando conectividade...', 'info');
            try {
                const response = await fetch(`${API_BASE}/health`);
                if (response.ok) {
                    const data = await response.json();
                    showResult(`✅ Conectividade OK: ${data.service}`, 'success');
                } else {
                    showResult(`❌ Health check falhou: ${response.status}`, 'error');
                }
            } catch (error) {
                showResult(`❌ Erro de conexão: ${error.message}`, 'error');
            }
        }
        
        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            showResult('Fazendo login...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    showResult(`✅ Login realizado com sucesso!<br>
                        Usuário: ${data.username}<br>
                        Tipo: ${data.role}<br>
                        Token: ${data.access_token.substring(0, 20)}...`, 'success');
                } else {
                    const error = await response.json();
                    showResult(`❌ Erro no login: ${error.detail}`, 'error');
                }
            } catch (error) {
                showResult(`❌ Erro de conexão no login: ${error.message}`, 'error');
            }
        }
        
        // Testar conectividade ao carregar
        window.onload = () => testHealth();
    </script>
</body>
</html>
